<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Tools</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAV BAR -->
  <nav>

    <a href="#" class="nav-item active" id="stopwatchNav">STOPWATCH</a>
    <a href="#" class="nav-item" id="timerNav">TIMER</a>
    <a href="#" class="nav-item" id="dobNav">DOB CALCULATOR</a>

  </nav>

  <main>

    <!-- STOP WATCH-->
    <section id="stopwatchPage" class="page">
      <div class="stopwatch-container">
        <p id="title">Stop Watch</p>
        <div id="display">00:00:00</div>
        <div id="controls">
          <button id="start">START</button>
          <button id="stop">PAUSE</button>
          <button id="reset">RESET</button>
        </div>
      </div>
    </section>


    <!-- TIMER -->
    <section id="timerpage" class="page">
      <div class="timer-container">
        <p id="title-timer">Timer</p>
        <div id="display-timer">00:00:00</div>
        <div id="controls-timer">
          <button id="start-timer">START</button>
          <button id="stop-timer">PAUSE</button>
          <button id="reset-timer">RESET</button>
        </div>
      </div>
    </section>


    <!-- DOB PAGE-->
    <section id="dobpage" class="page">
      <div class="dob-container">
        <p id="dob-title">DOB Calculator</p>
        <label id="dob-enter" for="dob">Enter your Date of Birth</label>
        <input type="date" id="dob">
        <button id="calculate-age">CALCULATE</button>
        <p id="result-dob">Your Age will Appear here</p>
      </div>
    </section>

  </main>


  <script src="index.js"></script>
</body>

</html>
